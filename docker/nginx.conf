# Configuración de Nginx para Laravel 11 + Inertia.js en Railway
# Sirve la aplicación PHP-FPM en el puerto 80

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Formato de log simplificado para Railway
    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # Tamaño máximo de carga (para posibles futuros uploads)
    client_max_body_size 20M;

    # Compresión gzip para assets estáticos
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # Headers de seguridad básicos
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        # Assets compilados por Vite — caché agresivo (hash en el nombre)
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Íconos PWA y assets estáticos
        location /icons/ {
            expires 30d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # Todas las demás rutas van a Laravel (SPA con Inertia)
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Procesamiento de PHP-FPM
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 120;
        }

        # Bloquear acceso a archivos ocultos (.env, .git, etc.)
        location ~ /\. {
            deny all;
        }
    }
}
